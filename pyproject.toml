[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "secure-oc"
version = "0.10.0"
description = "Secure wrapper around opencode with an encrypted API-key store"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
    "cryptography>=50.0",
]

[project.optional-dependencies]
# Stronger key derivation (Argon2id), OS keyring integration and fast
# process/port inspection. Recommended.
full = [
    "argon2-cffi>=25.1",
    "keyring>=25.7",
    "psutil>=7.2",
    "secretstorage>=3.5 ; sys_platform == 'linux'",
]

[project.scripts]
secure-oc = "secure_oc.cli:main"

[tool.setuptools.packages.find]
include = ["secure_oc*"]
